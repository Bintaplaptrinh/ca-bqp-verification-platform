[project]
name = "cabqp"
version = "1.0.0"
description = "CA/BQP evidence-driven verification platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "redis>=5.0",
  "celery>=5.4",
  "minio>=7.2",
  "rapidfuzz>=3.9",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  # pdfplumber requires Pillow>=12.2; every other dependency accepts it.
  "pillow>=12.2",
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.3.1",
  "easyocr==1.7.2",
  "opencv-python-headless==4.14.0.94",
  # vietocr is deliberately NOT a hard dependency: it hard-pins pillow==10.2.0, which is
  # unsatisfiable alongside pdfplumber. It stays an optional A/B benchmark candidate
  # (see [project.optional-dependencies] vietocr) and is imported lazily in ocr/engines.py.
  "pymupdf==1.28.2",
  "pdfplumber==0.11.10",
  "camelot-py==2.0.0",
  "scikit-image==0.26.0",
  "pandas==3.0.5",
  "pytesseract>=0.3.13",
  "PyYAML>=6.0.2",
  "sentence-transformers>=3.0",
  "python-magic>=0.4.27; platform_system != 'Windows'",
  "prometheus-client>=0.21",
  # Password generation for issued accounts. Pinned to the Git source on purpose:
  # the name "passwordgen" on PyPI is an unrelated project (stuck at 0.2), so a
  # plain `pip install passwordgen` silently installs the wrong package.
  "passwordgen @ git+https://github.com/Kagias/secure-password-generator.git",
]

[project.optional-dependencies]
# Optional OCR benchmark candidate. Installing this downgrades Pillow to 10.2.0 and is
# therefore incompatible with pdfplumber-based table extraction; use an isolated
# environment when benchmarking OCR_RECOGNIZER=vietocr.
vietocr = [
  "vietocr==0.3.13",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "types-redis>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI's dependency injection is expressed as `Depends(...)` in argument
  # defaults. B008 is a false positive for every route in this codebase.
  "B008",
  # Compressed one-statement-per-line style is used throughout the pre-existing
  # service modules. Reformatting them is a separate change from any behaviour
  # fix, so the rules stay off rather than making `ruff check` permanently red.
  "E701",
  "E702",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["migrations/"]
