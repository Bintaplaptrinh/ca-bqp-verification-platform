server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the exact server build to anyone probing the deployment.
  server_tokens off;

  # Clickjacking and MIME-sniffing defence for the SPA itself. The API sets the
  # same headers from its own middleware (shared/middleware.py); both are needed
  # because the two are served by different servers, and a header set on the API
  # response says nothing about the document that embeds it.
  #
  # The SPA's policy cannot be as tight as the API's: Vite emits a module script
  # and Tailwind's built stylesheet from this origin, the app talks to /api on
  # this origin, and index.html pulls the Inter / Be Vietnam Pro / Material
  # Symbols webfonts from Google. Those two font origins are therefore allowed
  # explicitly, and dropping them would silently break the icon ligatures the
  # UI (and the e2e label matching) relies on. No inline script, no plugin
  # content, and no document may frame this page.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend honours this only when the connecting peer is listed in
    # TRUSTED_PROXY_IPS, so this container's address has to be configured there
    # for per-client rate limiting to see real client addresses.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:8000;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
